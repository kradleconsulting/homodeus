name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Homodeus.slnx

      - name: Build
        run: dotnet build Homodeus.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Homodeus.Tests/Homodeus.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Homodeus.Tests/TestResults/test-results.trx
